services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  neo4j:
    image: neo4j:5.23-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change-me-strong-password}
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
      - ./neo4j/import:/var/lib/neo4j/import
      - ./neo4j/plugins:/plugins

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: superbrain
      POSTGRES_USER: superbrain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superbrain -d superbrain"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis_data:/data

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-me-searxng-secret}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_started
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-change-me-strong-password}
      NEO4J_DATABASE: neo4j
      API_PORT: 4000
      APP_SECRET: ${APP_SECRET:-change-me-to-a-long-random-secret}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ryewonderchild.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-admin-password}
      ADMIN_USER_ID: ${ADMIN_USER_ID:-admin}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
      POSTGRES_URL: postgres://superbrain:${POSTGRES_PASSWORD:-change-me-postgres-password}@postgres:5432/superbrain
      REDIS_URL: redis://redis:6379
      WEB_SEARCH_URL: http://searxng:8080
      DEFAULT_MONTHLY_TOKEN_QUOTA: ${DEFAULT_MONTHLY_TOKEN_QUOTA:-1000000}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://ryewonderchild.com}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      UPLOAD_DIR: /data/uploads
    volumes:
      - ./uploads:/data/uploads

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE: ${PUBLIC_API_BASE:-}
    restart: unless-stopped
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
